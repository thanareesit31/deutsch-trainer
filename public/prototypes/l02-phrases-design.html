<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รูปแบบประโยคบท 2</title>
<style>
*{box-sizing:border-box}body{margin:0;font:17px/1.7 system-ui,sans-serif;color:#263d32;background:#f8faf6}button{font:inherit;cursor:pointer}aside{position:fixed;width:230px;inset:0 auto 0 0;background:white;border-right:1px solid #e2e8df;padding:40px 24px}aside strong{font-size:25px}aside p{padding:14px;border-radius:12px}aside .active{background:#eaf0e4;color:#295540}main{margin-left:230px;max-width:1250px;padding:32px 42px}.review{font-size:14px;color:#667968;margin-bottom:24px}.crumb{color:#59735f;margin-bottom:30px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 28px}button{border:1px solid #dce4d7;background:white;color:inherit;border-radius:12px;padding:13px 18px}nav button[aria-current=true],.primary{background:#295540;color:white;border-color:#295540}.progress{display:flex;gap:20px;align-items:center;margin:25px 0}.track{height:8px;border-radius:10px;background:#e5eadf;flex:1}.track span{display:block;height:100%;background:#83a383;border-radius:10px}.card{padding:36px;border:1px solid #e0e7dd;border-radius:24px;background:white}.grid{display:grid;grid-template-columns:minmax(220px,310px) 1fr;gap:32px;align-items:start}img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px}figure{margin:0}figcaption{font-size:15px;color:#687b69;text-align:center;margin-top:12px}h1{font-size:29px;margin:0 0 20px;line-height:1.5}.badge{display:inline-block;padding:4px 12px;border-radius:9px;background:#edf2e8;font-size:17px;font-weight:500;margin-right:12px}.choices{display:grid;gap:12px}.choices button{text-align:left;min-height:66px;font-size:20px}.selected{outline:2px solid #6d786e}.answer{min-height:80px;padding:12px;border:1px dashed #d8e1d3;border-radius:14px;margin:18px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tokens{display:flex;gap:8px;flex-wrap:wrap}.fact{padding:25px;border:1px solid #dce5d7;border-top:5px solid #295540;border-radius:18px}.fact b{font-size:25px}.fact dl div{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #edf0e9;padding:10px 0}.fact dd{margin:0}.reading{font-size:21px}.feedback{padding:22px;background:#eff5eb;border-radius:16px;margin-top:25px}.feedback p{margin:7px 0}.controls{display:flex;justify-content:space-between;margin-top:28px}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #ba932a;outline-offset:3px}[hidden]{display:none!important}@media(max-width:750px){aside{display:none}main{margin:0;padding:22px 16px}.grid{grid-template-columns:1fr}.card{padding:20px}.visual{max-width:280px;margin:auto;width:100%}h1{font-size:25px}nav button{font-size:14px;padding:9px}.choices button{font-size:18px}}
</style>
<aside><strong>Deutsch<br>mit Sun.</strong><p>หน้าแรก</p><p class="active">บทเรียน</p><p>แบบฝึกหัด</p><p>ทบทวน</p></aside>
<main><div class="review">ตัวอย่างการออกแบบ · บท 2</div><div class="crumb">A1.1　/　Lektion 02　/　Redemittel</div><nav aria-label="ดูตัวอย่างหน้าจอ"></nav><div class="progress"><span id="progress-label"></span><div class="track"><span id="bar"></span></div></div><section class="card"><div class="grid"><div id="visual" class="visual"></div><div><h1 id="prompt"></h1><div id="response"></div></div></div><div id="feedback" class="feedback" role="status" hidden></div><div class="controls"><button id="back">ย้อนกลับ</button><button id="check" class="primary">ตรวจคำตอบ</button></div></section></main>
<script>
const scenes=[
 {tab:'ถามอาชีพ',kind:'choice',image:'/images/lektion-2-profession-pairs/hairdresser.webp',alt:'ช่างทำผมสองคนถืออุปกรณ์ทำผมอยู่ในร้าน',caption:'ทั้งคู่ทำงานที่ร้าน Haarfit',prompt:'Was macht ihr beruflich?',choices:['Wir arbeiten als Friseure.','Wir wohnen in Berlin.','Wir kommen aus Thailand.'],correct:0,reply:'Wir arbeiten als Friseure.',th:'พวกเราทำงานเป็นช่างทำผม',reason:'ถามอาชีพของคนสองคน จึงตอบด้วย Wir arbeiten als …'},
 {tab:'บอกที่ทำงาน',kind:'order',facts:[['ผู้ตอบ','Nora'],['สถานที่ทำงาน','Haarfit']],prompt:'Wo arbeitest du?',tokens:['bei','Haarfit.','Ich','arbeite'],correct:[2,3,0,1],reply:'Ich arbeite bei Haarfit.',th:'ฉันทำงานที่ร้านฮาร์ฟิต',reason:'ใช้ bei ตามด้วยชื่อสถานที่ทำงาน ส่วน als ใช้บอกอาชีพ'},
 {tab:'อ่านข้อมูลบุคคล',kind:'choice',reading:'Ich heiße Nora. Ich bin 28 Jahre alt. Ich wohne in Berlin.',prompt:'Wie alt ist Nora?',choices:['18 Jahre alt.','28 Jahre alt.','82 Jahre alt.'],correct:1,reply:'Nora ist 28 Jahre alt.',th:'นอร่าอายุ 28 ปี',reason:'ข้อความบอกอายุด้วย Ich bin 28 Jahre alt.'},
 {tab:'สัมภาษณ์คู่',kind:'choice',facts:[['ผู้ตอบ','Nora + Tim'],['อยู่ด้วยกัน','ใช่'],['แต่งงานแล้ว','ไม่ใช่']],prompt:'Seid ihr verheiratet?',choices:['Ja, wir sind verheiratet.','Nein, wir sind nicht verheiratet.','Wir wohnen in Berlin.'],correct:1,reply:'Nein, wir sind nicht verheiratet.',th:'ไม่ พวกเราไม่ได้แต่งงานกัน',reason:'การอยู่ด้วยกันกับการแต่งงานเป็นคนละข้อมูล คู่นี้อยู่ด้วยกันแต่ยังไม่ได้แต่งงาน'}
];
let active=0;const states=scenes.map(()=>({selection:[],checked:false}));const nav=document.querySelector('nav');scenes.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.tab;b.onclick=()=>{active=i;render()};nav.append(b)});
const visual=document.querySelector('#visual'),prompt=document.querySelector('#prompt'),response=document.querySelector('#response'),feedback=document.querySelector('#feedback'),check=document.querySelector('#check');
function button(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;return b}
function render(){const s=scenes[active],state=states[active];[...nav.children].forEach((b,i)=>b.setAttribute('aria-current',String(i===active)));document.querySelector('#progress-label').textContent=s.tab+' · '+(active+1)+' / '+scenes.length;document.querySelector('#bar').style.width=((active+1)/scenes.length*100)+'%';visual.replaceChildren();if(s.image){const f=document.createElement('figure'),im=document.createElement('img'),cap=document.createElement('figcaption');im.src=s.image;im.alt=s.alt;cap.textContent=s.caption;f.append(im,cap);visual.append(f)}else{const box=document.createElement('div');box.className='fact';if(s.reading){box.classList.add('reading');box.lang='de';box.textContent=s.reading}else{const dl=document.createElement('dl');s.facts.forEach(([label,value])=>{const row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;row.append(dt,dd);dl.append(row)});box.append(dl)}visual.append(box)}prompt.replaceChildren();const badge=document.createElement('span');badge.className='badge';badge.textContent=s.reading?'?':'A';if(!s.reading)prompt.append(badge);prompt.append(document.createTextNode(s.prompt));prompt.lang='de';response.replaceChildren();if(s.kind==='choice'){const list=document.createElement('div');list.className='choices';s.choices.forEach((label,i)=>{const b=button(label,()=>{state.selection=[i];render()});b.lang='de';b.disabled=state.checked;b.classList.toggle('selected',state.selection[0]===i);b.setAttribute('aria-pressed',String(state.selection[0]===i));list.append(b)});response.append(list)}else{const answer=document.createElement('div');answer.className='answer';answer.setAttribute('aria-label','คำตอบที่เรียง');const badge=document.createElement('span');badge.className='badge';badge.textContent='B';answer.append(badge);state.selection.forEach((i,at)=>{const b=button(s.tokens[i],()=>{state.selection.splice(at,1);render()});b.disabled=state.checked;answer.append(b)});const bank=document.createElement('div');bank.className='tokens';s.tokens.forEach((text,i)=>{const b=button(text,()=>{state.selection.push(i);render()});b.disabled=state.checked||state.selection.includes(i);bank.append(b)});response.append(answer,bank)}feedback.hidden=!state.checked;if(state.checked){const correct=s.kind==='choice'?state.selection[0]===s.correct:JSON.stringify(state.selection)===JSON.stringify(s.correct);feedback.replaceChildren();for(const text of [correct?'ถูกต้อง':'ลองดูคำตอบนี้',s.reply,s.th,s.reason]){const p=document.createElement('p');p.textContent=text;feedback.append(p)}}check.textContent=state.checked?'ต่อไป':'ตรวจคำตอบ';check.disabled=!state.checked&&(s.kind==='choice'?state.selection.length!==1:state.selection.length!==s.tokens.length);document.querySelector('#back').disabled=active===0}
check.onclick=()=>{if(states[active].checked)active=(active+1)%scenes.length;else states[active].checked=true;render()};document.querySelector('#back').onclick=()=>{active=Math.max(0,active-1);render()};render();
</script></html>
