function commit(change,draw=true){const next=structuredClone(state);change(next);const changed=current(next);if(changed)changed.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(next));state=next;if(window.parent!==window)window.parent.postMessage({type:'grammar-preview-progress'},'*');document.getElementById('storage-error').hidden=true;if(draw)render();return true;}catch{storageError('บันทึกผลไม่ได้ คำตอบยังไม่ถูกส่ง กรุณาตรวจพื้นที่จัดเก็บของเบราว์เซอร์แล้วกดอีกครั้ง');return false;}}
function current(s=state){return s.sessions.find(x=>x.id===s.activeId);}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function normalize(v){return v.normalize('NFC').trim().replace(/\s+/g,' ').replace(/[.!?]+$/u,'').trim();}
function answerText(item){return item.question.kind==='order'?item.selected.map(i=>item.question.tokens[i]).join(' '):item.response;}
function grade(item){const q=item.question;if(q.kind==='write')return {correct:null,errorTag:null};const value=normalize(answerText(item));const correct=q.acceptedAnswers.some(x=>normalize(x)===value);return {correct,errorTag:correct?null:(q.kind==='order'?'word_order':q.knownErrors?.[value]||'unclassified')};}

function pickGroup(pool,count){if(BANK.historySkill==='phrases'){
 const seen=new Set(combinedHistory().flatMap(s=>s.items.map(i=>i.question.id)));
 const remaining=shuffle(pool),chosen=[],used=new Set();
 const cycle=BANK.skillCycle;
 while(remaining.length&&chosen.length<count){
  const skill=cycle[chosen.length%cycle.length];
  remaining.sort((a,b)=>Number(seen.has(a.id))-Number(seen.has(b.id))||Number(a.subskill!==skill)-Number(b.subskill!==skill));
  const q=remaining.shift(),ids=q.requiredItemIds||[q.itemId];
  if(ids.some(id=>used.has(id)))continue;
  chosen.push(q);ids.forEach(id=>used.add(id));
 }
 return chosen;
}if(BANK.requireLearned){const seen=new Set(combinedHistory().flatMap(s=>s.items.map(i=>i.question.id)));const remaining=shuffle(pool),chosen=[],words=new Set();const cycle=BANK.skillCycle||['vocabulary_meaning','vocabulary_meaning','vocabulary_article','vocabulary_article','vocabulary_spelling'];while(remaining.length&&chosen.length<Math.min(count,pool.length)){const skill=cycle[chosen.length%cycle.length];remaining.sort((a,b)=>Number(a.subskill!==skill)-Number(b.subskill!==skill)||Number(words.has(a.itemId))-Number(words.has(b.itemId))||Number(seen.has(a.id))-Number(seen.has(b.id)));const q=remaining.shift();if(BANK.guidedOnePerTarget&&words.has(q.itemId))continue;chosen.push(q);words.add(q.itemId);}return chosen;}const last=new Map();combinedHistory().forEach(s=>s.items.forEach(x=>last.set(x.question.id,Math.max(last.get(x.question.id)||0,s.createdAt))));const remaining=shuffle(pool);const chosen=[],used={};while(chosen.length<Math.min(count,pool.length)){remaining.sort((a,b)=>(last.get(a.id)||0)-(last.get(b.id)||0)||(used[a.kind]||0)-(used[b.kind]||0));const q=remaining.shift();chosen.push(q);used[q.kind]=(used[q.kind]||0)+1;}const order={choice:0,cloze:1,order:2};return chosen.sort((a,b)=>order[a.kind]-order[b.kind]);}
function pick(pool,count,origin){
 pool=pool.filter(q=>isPracticeQuestionUnlocked(q,combinedHistory()));
 if(BANK.sequenceByTopic)return pickPhraseSequence(pool,count,origin);
 if(BANK.workflow==='daily'){
  const plan=planDailyPractice(pool,combinedHistory());
  return plan.questionIds.slice(0,count).map(id=>pool.find(q=>q.id===id)).filter(Boolean);
 }
 return BANK.sections&&pool.length===BANK.questions.length&&count===BANK.defaultCount?BANK.sections.flatMap(section=>pickGroup(pool.filter(q=>(q.stageId||q.topicId)===section.topicId),section.count)):pickGroup(pool,count);
}
function start(pool,count,origin='practice'){let selected;try{selected=pick(pool,count,origin);}catch{storageError('อ่านประวัติฝึกไม่ได้ กรุณาโหลดหน้าใหม่แล้วลองอีกครั้ง');return;}if(!selected.length)return;const session={id:crypto.randomUUID(),origin,workflow:origin==='review'?'topic':BANK.workflow??'topic',createdAt:new Date().toISOString(),position:0,completed:false,items:selected.map(q=>{const question=structuredClone(q);if(question.options)question.options=shuffle(question.options);return {question,response:'',selected:[],rubricChecks:[],tokenOrder:question.tokens?shuffle(question.tokens.map((_,i)=>i)):[],hintUsed:false,translationUsed:false,wordHelpTokens:[],attempt:null};})};if(commit(s=>{s.sessions.push(session);s.activeId=session.id;},false)){screen='session';render();focusTitle();}}

function playVocabularyFeedbackAudio(text,status){
 const synth=window.speechSynthesis;
 if(!synth||typeof SpeechSynthesisUtterance==='undefined'){status.textContent='อุปกรณ์นี้ไม่รองรับเสียงสังเคราะห์';return;}
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang='de-DE';utterance.rate=.8;
 const voice=synth.getVoices().find(candidate=>candidate.lang.toLowerCase().startsWith('de'));

function responseExplanation(q,attempt){

 if(authored)return authored.message;
 if(q.kind==='order'){
  const expected=q.acceptedAnswers[0].split(/\s+/),actual=attempt.response.trim().split(/\s+/);const at=expected.findIndex((word,index)=>normalize(word)!==normalize(actual[index]||''));
  if(at>=0)return `ในประโยคนี้ คำลำดับที่ ${at+1} คือ “${expected[at]}” ลองเทียบกับ “${actual[at]||'คำที่ยังไม่ได้วาง'}” ที่คุณวางไว้ `+(q.explanation||'');
 }
 if(q.practice&&q.kind==='cloze'){
  const expected=normalize(q.acceptedAnswers[0]),actual=normalize(attempt.response),parts=q.answerParts||[];
  if(expected.toLocaleLowerCase('de')===actual.toLocaleLowerCase('de'))return 'คำและลำดับตรงแล้ว ตรวจตัวพิมพ์ใหญ่ในคำตอบ เช่น '+q.acceptedAnswers[0];
  const prefix=parts[0]?.text;
  if(prefix&&!actual.startsWith(prefix))return 'ข้อนี้กำหนดคำเริ่มต้นและข้อมูลเป็น “'+prefix+'” ลองตรวจส่วนต้นของคำตอบ';
  const tail=parts.at(-1);
  if(tail&&['participle','verb'].includes(tail.role)&&tail.position?.includes('ท้าย')&&!actual.endsWith(normalize(tail.text)))return 'ท้ายประโยคนี้ใช้ “'+normalize(tail.text)+'” ซึ่งเป็น'+tail.label+' ตรวจรูปคำและตำแหน่งท้ายประโยค';
  const finite=parts.findIndex(part=>['auxiliary','verb'].includes(part.role)&&part.position?.includes('ตำแหน่ง 2'));
  if(finite>=0){const at=parts.slice(0,finite).reduce((n,part)=>n+part.text.split(/\s+/).length,0);if(normalize(actual.split(/\s+/)[at]||'')!==normalize(parts[finite].text))return 'ในโครงนี้ กริยาที่ผันแล้วคือ “'+normalize(parts[finite].text)+'” ในตำแหน่งที่ 2 ให้ผันตามประธานและตรวจคำที่วางก่อนหน้า';}
  const article=expected.match(/\b(ein|eine|einen|kein|keine|keinen) ([A-ZÄÖÜ][\p{L}]*)/u);
  if(article&&actual.includes(article[2])&&!actual.includes(article[1]+' '+article[2]))return 'ในโครงประโยคนี้ใช้ “'+article[1]+' '+article[2]+'” ตรวจรูป Artikel ที่อยู่หน้าคำนาม';
  const time=parts.find(part=>part.role==='time');if(time&&!actual.includes(normalize(time.text)))return 'ข้อมูลเวลาต้องตรงกับโจทย์ ข้อนี้ใช้ “'+normalize(time.text)+'”';
  const words=expected.split(/\s+/),response=actual.split(/\s+/),at=words.findIndex((word,index)=>word!==response[index]);
  return at>=0?'จุดที่ยังต่างจากคำตอบตามข้อมูลคือ “'+(response[at]||'ส่วนที่ยังขาด')+'” เทียบกับ “'+words[at]+'” '+(q.explanation||''):q.explanation||'';
 }

}
