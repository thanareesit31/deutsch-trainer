function appendGerman(container,text){
if(BANK.requireLearned&&!activeItem()?.attempt){container.append(document.createTextNode(text));return;}
 const tokens=text.match(/[\p{L}]+|\s+|[^\p{L}\s]+/gu)||[];
 for(let i=0;i<tokens.length;i++){
  let token=tokens[i];
  const phrase=tokens.slice(i,i+3).join('');
  const phraseMeaning=/^\p{L}+\s+\p{L}+$/u.test(phrase)?BANK.thaiSupport?.phrases?.[phrase.toLocaleLowerCase('de')]:undefined;
  const meaning=phraseMeaning??BANK.thaiSupport?.glossary[token]??BANK.thaiSupport?.glossary[token.toLocaleLowerCase('de')];
  if(phraseMeaning){token=phrase;i+=2;}
  if(meaning){const word=node('span',token,{class:'word-meaning',tabindex:'0','data-th':meaning,'aria-label':token+': '+meaning});const recordSupport=()=>{if(activeItem()&&!activeItem().attempt&&!activeItem().translationUsed)commit(n=>{activeItem(n).translationUsed=true;},false);};word.addEventListener('pointerenter',recordSupport);word.addEventListener('focus',recordSupport);word.addEventListener('click',recordSupport);container.append(word);}
  else container.append(document.createTextNode(token));
 }
}

function nounFormComparison(comparison,explanation){
 const panel=node('section',undefined,{class:'grammar-form-comparison','aria-label':'รูปคำนามและคำที่ใช้ในประโยค'});
 panel.append(node('h3',comparison.title||'ดูรูปคำนามก่อนเลือกคำตอบ'));
 const grid=node('div',undefined,{class:'grammar-form-grid'+(comparison.forms.length===1?' single':'')});
 for(const form of comparison.forms){
  const row=node('div',undefined,{class:'grammar-form-row'+(form.current?' current':'')});
  row.append(node('p',form.label,{class:'grammar-form-label'}));
  const noun=node('p',undefined,{class:'grammar-form-noun',lang:'de'});
  noun.append(node('span',undefined,{class:'grammar-form-dot '+form.gender,'aria-hidden':'true'}),node('span',form.article));
  const spelling=node('span');
  for(const part of form.parts)spelling.append(node('span',part.text,part.changed?{class:'grammar-form-change'}:{}));
  noun.append(spelling);
  row.append(noun,node('p',`${comparison.context||'หลัง es gibt'}: ${form.answer||form.negative} ${form.noun}`,{class:'grammar-form-answer',lang:'de'}));
  grid.append(row);
 }
 panel.append(grid,node('p',explanation,{class:'grammar-form-note',lang:'th'}));
 return panel;
}

if(q.kind==='order'){card.append(node('p',q.orderUnit==='ประโยค'?'แตะประโยคเพื่อเรียงบทสนทนา แตะอีกครั้งเพื่อนำกลับ':'แตะคำเพื่อวางในประโยค แตะคำที่วางแล้วเพื่อนำกลับ',{class:'muted'}));const slots=node('div',undefined,{class:'slots','data-empty':q.orderUnit==='ประโยค'?'แตะประโยคด้านล่างเพื่อเรียงบทสนทนา':'แตะคำด้านล่างเพื่อเรียงประโยค','aria-label':q.orderUnit==='ประโยค'?'บทสนทนาที่เรียง':'ประโยคที่เรียง'});item.selected.forEach((idx,pos)=>{const b=button(q.tokens[idx],()=>commit(n=>{activeItem(n).selected.splice(pos,1);}),{'aria-label':'นำ'+(q.orderUnit||'คำ')+' '+q.tokens[idx]+' กลับ',lang:'de'});b.disabled=!!item.attempt;slots.append(b);});const words=node('div',undefined,{class:'choices','aria-label':q.orderUnit==='ประโยค'?'ประโยคในบทสนทนา':'คลังคำ'});item.tokenOrder.filter(idx=>!item.selected.includes(idx)).forEach(idx=>{const b=button(q.tokens[idx],()=>commit(n=>{activeItem(n).selected.push(idx);}),{'aria-label':'เพิ่ม'+(q.orderUnit||'คำ')+' '+q.tokens[idx],lang:'de'});b.disabled=!!item.attempt;words.append(b);});card.append(slots,words);}

if(item.attempt){const navigation=node('div',undefined,{class:'row actions'});navigation.append(backButton(q));const next=card.querySelector('#next');if(next)navigation.append(next);card.append(navigation);}decorateVocabularyNouns(card,q);app.append(card);}
function submit(){const item=activeItem();if(!item||item.attempt||!ready(item))return;const result=grade(item);commit(n=>{const row=activeItem(n);row.attempt={...result,response:answerText(row),...(row.question.kind==='write'?{selfAssessed:true,selfAssessment:row.question.rubric.filter((_,index)=>row.rubricChecks.includes(index))}:{}),confidence:null,status:'completed',submittedAt:new Date().toISOString(),hintUsed:row.hintUsed,translationUsed:row.translationUsed===true};});}
function sectionBreak(){
 const s=current();const previous=s.items[s.position-1].question;

 window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.data?.type!=='grammar-preview-direct-start')return;
  if(BANK.requireLearned){
    if(!Array.isArray(event.data.learnedItemIds))return;
    const learned=new Set(event.data.learnedItemIds.filter(id=>typeof id==='string'));
    BANK.questions=BANK.questions.filter(q=>(q.requiredItemIds||[q.itemId||q.targetId]).every(id=>typeof id==='string'&&learned.has(id)));
    if(BANK.sequenceByTopic)BANK.questions=BANK.questions.filter(q=>q.interaction!=='match'||BANK.questions.filter(other=>other.matchGroupId===q.matchGroupId).length===2);
    if(BANK.nextTopics)BANK.nextTopic=BANK.nextTopics.find(topic=>topic.itemIds.some(id=>learned.has(id)));
    if(state.sessions.some(session=>!session.completed&&session.items.some(item=>(item.question.requiredItemIds||[item.question.itemId||item.question.targetId]).some(id=>!learned.has(id))))){app.replaceChildren(node('p','ยังยืนยันประวัติเรียนของรอบที่ค้างไม่ได้ กรุณากลับไปตรวจบทเรียนก่อน'));app.append(button(BANK.learnLabel||'ไปเรียนเนื้อหานี้',()=>navigateTo(BANK.learnHref),{class:'primary'}));return;}
    if(BANK.sections){BANK.sections=BANK.sections.filter(section=>BANK.questions.some(q=>(q.stageId||q.topicId)===section.topicId));BANK.defaultCount=BANK.sections.reduce((n,section)=>n+Math.min(section.count,BANK.questions.filter(q=>(q.stageId||q.topicId)===section.topicId).length),0);}
    if(!BANK.questions.length){app.replaceChildren(node('p',BANK.emptyMessage||'ยังไม่มีคำที่เรียนแล้วในหัวข้อนี้'));app.append(button(BANK.learnLabel||'ไปเรียนคำศัพท์',()=>navigateTo(BANK.learnHref),{class:'primary'}));return;}
  }
  const requested=typeof event.data.resumeId==='string'?state.sessions.find(s=>s.id===event.data.resumeId&&!s.completed&&!s.archived):undefined;
  const pending=requested||(current()&&!current().completed&&!current().archived?current():[...state.sessions].reverse().find(s=>!s.completed&&!s.archived));
