'use strict';

const BANK=JSON.parse(document.getElementById('bank').textContent);

function storageError(message){const el=document.getElementById('storage-error');el.hidden=false;el.className='error';el.textContent=message;}
function commit(change,draw=true){const next=structuredClone(state);change(next);const changed=current(next);if(changed)changed.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(next));state=next;if(window.parent!==window)window.parent.postMessage({type:'grammar-preview-progress'},'*');document.getElementById('storage-error').hidden=true;if(draw)render();return true;}catch{storageError('บันทึกผลไม่ได้ คำตอบยังไม่ถูกส่ง กรุณาตรวจพื้นที่จัดเก็บของเบราว์เซอร์แล้วกดอีกครั้ง');return false;}}
function current(s=state){return s.sessions.find(x=>x.id===s.activeId);}
function activeItem(s=state){const session=current(s);return session?.items[session.position];}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function normalize(v){return v.normalize('NFC').trim().replace(/\s+/g,' ').replace(/[.!?]+$/u,'').trim();}
function answerText(item){return item.question.kind==='order'?item.selected.map(i=>item.question.tokens[i]).join(' '):item.response;}
function grade(item){const q=item.question;if(q.kind==='write')return {correct:null,errorTag:null};const value=normalize(answerText(item));const correct=q.acceptedAnswers.some(x=>normalize(x)===value);return {correct,errorTag:correct?null:(q.kind==='order'?'word_order':q.knownErrors[value]||'unclassified')};}
function combinedHistory(){
 const account=BANK.questions.every(q=>q.topicId.startsWith('L13-'))?window.name.split('-account-')[1]:undefined;
 return account?readL13PracticeHistory(account,localStorage,BANK.historySkill||'grammar'):parsePracticeHistory(JSON.stringify(state),'/practice/L13/grammar/basic');
}
function pickGroup(pool,count){if(BANK.historySkill==='phrases'){
 const seen=new Set(combinedHistory().flatMap(s=>s.items.map(i=>i.question.id)));
 const remaining=shuffle(pool),chosen=[],used=new Set();
 const cycle=BANK.skillCycle;
 while(remaining.length&&chosen.length<count){
  const skill=cycle[chosen.length%cycle.length];
  remaining.sort((a,b)=>Number(seen.has(a.id))-Number(seen.has(b.id))||Number(a.subskill!==skill)-Number(b.subskill!==skill));
  const q=remaining.shift(),ids=q.requiredItemIds||[q.itemId];
  if(ids.some(id=>used.has(id)))continue;
  chosen.push(q);ids.forEach(id=>used.add(id));
 }
 return chosen;
}if(BANK.requireLearned){const seen=new Set(combinedHistory().flatMap(s=>s.items.map(i=>i.question.id)));const remaining=shuffle(pool),chosen=[],words=new Set();const cycle=BANK.skillCycle||['vocabulary_meaning','vocabulary_meaning','vocabulary_article','vocabulary_article','vocabulary_spelling'];while(chosen.length<Math.min(count,pool.length)){const skill=cycle[chosen.length%cycle.length];remaining.sort((a,b)=>Number(a.subskill!==skill)-Number(b.subskill!==skill)||Number(words.has(a.itemId))-Number(words.has(b.itemId))||Number(seen.has(a.id))-Number(seen.has(b.id)));const q=remaining.shift();chosen.push(q);words.add(q.itemId);}return chosen;}const last=new Map();combinedHistory().forEach(s=>s.items.forEach(x=>last.set(x.question.id,Math.max(last.get(x.question.id)||0,s.createdAt))));const remaining=shuffle(pool);const chosen=[],used={};while(chosen.length<Math.min(count,pool.length)){remaining.sort((a,b)=>(last.get(a.id)||0)-(last.get(b.id)||0)||(used[a.kind]||0)-(used[b.kind]||0));const q=remaining.shift();chosen.push(q);used[q.kind]=(used[q.kind]||0)+1;}const order={choice:0,cloze:1,order:2};return chosen.sort((a,b)=>order[a.kind]-order[b.kind]);}
function pick(pool,count,origin){
 if(BANK.sequenceByTopic)return pickPhraseSequence(pool,count,origin);
 if(BANK.workflow==='daily'){
  const plan=planDailyPractice(pool,combinedHistory());
  return plan.questionIds.slice(0,count).map(id=>pool.find(q=>q.id===id)).filter(Boolean);
 }
 return BANK.sections&&pool.length===BANK.questions.length&&count===BANK.defaultCount?BANK.sections.flatMap(section=>pickGroup(pool.filter(q=>(q.stageId||q.topicId)===section.topicId),section.count)):pickGroup(pool,count);
}
function start(pool,count,origin='practice'){let selected;try{selected=pick(pool,count,origin);}catch{storageError('อ่านประวัติฝึกไม่ได้ กรุณาโหลดหน้าใหม่แล้วลองอีกครั้ง');return;}if(!selected.length)return;const session={id:crypto.randomUUID(),origin,workflow:origin==='review'?'topic':BANK.workflow??'topic',createdAt:new Date().toISOString(),position:0,completed:false,items:selected.map(q=>{const question=structuredClone(q);if(question.options)question.options=shuffle(question.options);return {question,response:'',selected:[],rubricChecks:[],tokenOrder:question.tokens?shuffle(question.tokens.map((_,i)=>i)):[],hintUsed:false,translationUsed:false,attempt:null};})};if(commit(s=>{s.sessions.push(session);s.activeId=session.id;},false)){screen='session';render();focusTitle();}}
function node(tag,text,attrs={}){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));return e;}
function button(text,fn,attrs={}){const {disabled,...attributes}=attrs;const b=node('button',text,{type:'button',...attributes});b.disabled=disabled===true;b.addEventListener('click',fn);return b;}
function decorateVocabularyNouns(card,q){
 if(!BANK.nounPresentation||!BANK.articleColors)return;
 const dot=color=>{const d=node('span',undefined,{class:'article-dot','aria-hidden':'true'});Object.assign(d.style,{display:'inline-block',width:'11px',height:'11px',borderRadius:'50%',marginRight:'8px',verticalAlign:'middle',backgroundColor:BANK.articleColors[color]});return d;};
 const noun=BANK.nounPresentation[q.itemId];
 if(q.subskill==='vocabulary_meaning'&&noun)card.querySelector('.sentence')?.prepend(dot(noun.color));
 if(q.subskill==='vocabulary_spelling'&&noun){const input=card.querySelector('#response');if(input){const row=node('div',undefined,{class:'noun-spelling-answer'}),prefix=node('span',undefined,{class:'noun-prefix',lang:'de'});prefix.append(dot(noun.color),document.createTextNode(noun.label.split(' ')[0]));input.replaceWith(row);row.append(prefix,input);}}
 if(q.subskill==='vocabulary_article')for(const option of card.querySelectorAll('.choices button'))if(/^(der|die|das)$/u.test(option.textContent))option.prepend(dot(option.textContent));
 if(noun){const answer=card.querySelector('.feedback p[lang="de"]');if(answer){answer.replaceChildren(node('span','คำตอบ: '),dot(noun.color),document.createTextNode(noun.label));}}
}
function focusTitle(){document.getElementById('q-title')?.focus();}
function render(){app.replaceChildren();if(screen==='home'||!current()){home();return;}if(current().completed){summary();return;}if(current().workflow!=='guided'&&current().breakAt===current().position){sectionBreak();return;}question();}
function home(){app.append(node('h1',BANK.title),node('p',BANK.description));
const card=node('section',undefined,{class:'card'});
if(BANK.sections){card.append(button(`เริ่มฝึก ${BANK.defaultCount} ข้อ`,()=>start(BANK.questions,BANK.defaultCount),{class:'primary',id:'start'}));}
else {
const form=node('select',undefined,{id:'format'});
for(const[v,t]of [['all','คละรูปแบบในหัวข้อนี้'],['choice','เลือกคำตอบ'],['cloze','เติมคำ'],['order','เรียงคำ']])form.append(node('option',t,{value:v}));
const count=node('select',undefined,{id:'count'});

const info=node('p',undefined,{class:'muted',id:'pool-info'});
const startButton=button(`เริ่มฝึก ${BANK.defaultCount} ข้อ`,()=>{const pool=BANK.questions.filter(q=>form.value==='all'||q.kind===form.value);start(pool,count.value==='all'?pool.length:Number(count.value));},{class:'primary',id:'start'});
const refresh=()=>{const pool=BANK.questions.filter(q=>form.value==='all'||q.kind===form.value);const requested=count.value==='all'?pool.length:Number(count.value);const actual=Math.min(pool.length,requested);info.textContent=`มี ${pool.length} ข้อในรูปแบบที่เลือก · รอบนี้ ${actual} ข้อ`;startButton.textContent=`เริ่มฝึก ${actual} ข้อ`;};
form.onchange=refresh;count.onchange=refresh;
const options=node('details',undefined,{class:'setup-options'});
options.append(node('summary','ปรับชุดฝึก'),node('label','รูปแบบ',{for:'format'}),form,node('label','จำนวนข้อ',{for:'count'}),count,info);
card.append(startButton,options);refresh();}
app.append(card);
const pending=state.sessions.filter(s=>!s.completed&&!s.archived);if(pending.length){const list=node('section',undefined,{class:'card'});list.append(node('h2','ชุดที่ยังทำไม่จบ'));for(const s of [...pending].reverse())list.append(button(`ทำต่อ · ข้อ ${s.position+1}/${s.items.length}`,()=>{if(commit(n=>{n.activeId=s.id;},false)){screen='session';render();focusTitle();}}));app.append(list);}const done=state.sessions.filter(s=>s.completed);if(done.length)app.append(button('ดูผลรอบล่าสุด',()=>{if(commit(n=>{n.activeId=done.at(-1).id;},false)){screen='session';render();}}));}
function ready(item){return item.question.kind==='order'?item.selected.length===item.question.tokens.length:item.question.kind==='write'?item.response.trim().length>=item.question.writeMinimum&&item.question.rubric.every((_,index)=>item.rubricChecks?.includes(index)):normalize(item.response).length>0;}
function appendGerman(container,text){
if(BANK.requireLearned&&!activeItem()?.attempt){container.append(document.createTextNode(text));return;}
 const tokens=text.match(/[\p{L}]+|\s+|[^\p{L}\s]+/gu)||[];
 for(let i=0;i<tokens.length;i++){
  let token=tokens[i];
  const phrase=tokens.slice(i,i+3).join('');
  const phraseMeaning=/^\p{L}+\s+\p{L}+$/u.test(phrase)?BANK.thaiSupport?.phrases?.[phrase.toLocaleLowerCase('de')]:undefined;
  const meaning=phraseMeaning??BANK.thaiSupport?.glossary[token]??BANK.thaiSupport?.glossary[token.toLocaleLowerCase('de')];
  if(phraseMeaning){token=phrase;i+=2;}
  if(meaning){const word=node('span',token,{class:'word-meaning',tabindex:'0','data-th':meaning,'aria-label':token+': '+meaning});const recordSupport=()=>{if(activeItem()&&!activeItem().attempt&&!activeItem().translationUsed)commit(n=>{activeItem(n).translationUsed=true;},false);};word.addEventListener('pointerenter',recordSupport);word.addEventListener('focus',recordSupport);word.addEventListener('click',recordSupport);container.append(word);}
  else container.append(document.createTextNode(token));

}
function navigateTo(href){if(window.parent!==window)window.parent.location.assign(href);else window.location.assign(href);}
function sessionSections(session){const stageTitles={'stage-1':'อ่านและเข้าใจข้อความ','stage-2':'เลือกสำนวนให้ตรงสถานการณ์','stage-3':'จับคู่คำถามกับคำตอบ','stage-4':'เติมคำและเรียงประโยค','stage-5':'เขียนเกี่ยวกับสถานที่ของตัวเอง'};return [...new Map(session.items.map(item=>{const q=item.question,key=q.stageId||q.topicId;return [key,{topicId:key,title:BANK.sections?.find(section=>section.topicId===key)?.title||stageTitles[q.stageId]||q.topicName||BANK.title}];})).values()];}
function backButton(q){return button('← ย้อนกลับ',()=>{if(window.parent!==window){window.parent.location.assign(BANK.manualHref||'/practice/'+q.topicId.split('-')[0]+'/grammar');}else{screen='home';render();}});}

function question(){if(BANK.sequenceByTopic&&!activeItem().question.sequence){const notice=node('div',undefined,{class:'notice'});notice.append(node('p','รอบนี้เริ่มไว้ก่อนปรับรูปแบบ คุณทำต่อได้ หรือเก็บรอบนี้ไว้แล้วเริ่มชุดฝึกใหม่'),button('เริ่มรอบรูปแบบใหม่',()=>{if(commit(n=>{current(n).archived=true;},false))start(BANK.questions,BANK.defaultCount);}));app.append(notice);}if(BANK.sequenceByTopic&&activeItem().question.interaction==='match'&&matchingQuestion())return;const s=current(),item=activeItem(),saved=item.question,latest=BANK.questions.find(x=>x.id===saved.id);const q={...saved,prompt:latest?.prompt??saved.prompt,sentence:latest?.sentence??saved.sentence,hint:latest?.hint??saved.hint,explanation:latest?.explanation??saved.explanation,feedbackAnswer:latest?.feedbackAnswer??saved.feedbackAnswer};const guided=s.workflow==='guided';const guidedKey=x=>x.stageId||x.topicId;const topicItems=s.items.filter(i=>guidedKey(i.question)===guidedKey(q));const topicDone=topicItems.filter(i=>i.attempt).length;const top=node('div',undefined,{class:'practice-progress'});if(guided){const groups=sessionSections(s);const section=groups.findIndex(t=>t.topicId===(q.stageId||q.topicId));const title=groups[section]?.title||q.topicName||BANK.title;if(q.stageId)app.append(node('p',`ขั้น ${Math.max(0,section)+1} จาก ${groups.length} · ${title}`,{class:'muted'}));else app.append(node('p',`หัวข้อ ${Math.max(0,section)+1} จาก ${groups.length} · ${title}`,{class:'muted'}));}const progressDone=s.position+(item.attempt?1:0),progressTotal=s.items.length;top.append(node('span',`${progressDone} / ${progressTotal} ข้อ`),node('progress',undefined,{value:progressDone,max:progressTotal,'aria-label':'ความคืบหน้าชุดฝึก'}));app.append(top);const card=node('section',undefined,{class:'card','data-question-id':q.id});card.append(node('h1',q.prompt,{id:'q-title',tabindex:'-1',class:'tag question-instruction'}));
if(q.context)card.append(node('p',q.context,{class:'sentence',lang:'de'}));
if(q.sentence){const sentence=node('p',undefined,{class:'sentence',lang:q.sentenceLang||'de'});const parts=q.sentence.split('___');appendGerman(sentence,parts[0]);const blank=node('span',undefined,{class:'blank'});appendGerman(blank,item.response||'…');if(parts.length>1){sentence.append(blank);appendGerman(sentence,parts[1]||'');}card.append(sentence);}
if(q.kind==='choice'){const group=node('div',undefined,{class:'choices','aria-label':'ตัวเลือก'});for(const option of q.options){const b=button(option,()=>commit(n=>{activeItem(n).response=option;}),{'aria-pressed':item.response===option,lang:q.optionsLang||'de'});b.disabled=!!item.attempt;group.append(b);}card.append(group);}
if(q.kind==='write'){card.append(node('p','เขียนคำตอบของคุณเป็นภาษาเยอรมัน แล้วตรวจงานด้วยเกณฑ์ด้านล่าง',{class:'muted'}));const input=node('textarea',undefined,{id:'response',rows:'5',maxlength:'600',autocomplete:'off',spellcheck:'true',lang:'de','aria-label':'เขียนคำตอบภาษาเยอรมัน'});input.value=item.response;input.disabled=!!item.attempt;input.oninput=()=>{if(commit(n=>{activeItem(n).response=input.value;},false)){document.getElementById('check').disabled=!ready(activeItem());}};card.append(input);card.append(node('h2','ตรวจงานของตัวเอง'));for(const[label,index]of q.rubric.map((label,index)=>[label,index])){const row=node('label',undefined,{class:'write-rubric'});const check=node('input',undefined,{type:'checkbox'});check.checked=item.rubricChecks.includes(index);check.disabled=!!item.attempt;check.onchange=()=>{commit(n=>{const checks=activeItem(n).rubricChecks;check.checked?checks.push(index):checks.splice(checks.indexOf(index),1);});document.getElementById('check').disabled=!ready(activeItem());};row.append(check,node('span',label));card.append(row);}}
if(q.kind==='cloze'){card.append(node('label','คำตอบภาษาเยอรมัน',{for:'response'}));const input=node('input',undefined,{id:'response',autocomplete:'off',autocapitalize:'none',spellcheck:'false',lang:'de'});input.value=item.response;input.disabled=!!item.attempt;input.oninput=()=>{if(commit(n=>{activeItem(n).response=input.value;},false)){document.getElementById('check').disabled=!ready(activeItem());const blank=card.querySelector('.blank');blank.replaceChildren();appendGerman(blank,input.value||'…');}};input.onkeydown=e=>{if(e.key==='Enter'&&ready(activeItem())&&!activeItem().attempt)submit();};card.append(input);}
if(q.kind==='order'){card.append(node('p',q.orderUnit==='ประโยค'?'แตะประโยคเพื่อเรียงบทสนทนา แตะอีกครั้งเพื่อนำกลับ':'แตะคำเพื่อวางในประโยค แตะคำที่วางแล้วเพื่อนำกลับ',{class:'muted'}));const slots=node('div',undefined,{class:'slots','data-empty':q.orderUnit==='ประโยค'?'แตะประโยคด้านล่างเพื่อเรียงบทสนทนา':'แตะคำด้านล่างเพื่อเรียงประโยค','aria-label':q.orderUnit==='ประโยค'?'บทสนทนาที่เรียง':'ประโยคที่เรียง'});item.selected.forEach((idx,pos)=>{const b=button(q.tokens[idx],()=>commit(n=>{activeItem(n).selected.splice(pos,1);}),{'aria-label':'นำ'+(q.orderUnit||'คำ')+' '+q.tokens[idx]+' กลับ',lang:'de'});b.disabled=!!item.attempt;slots.append(b);});const words=node('div',undefined,{class:'choices','aria-label':q.orderUnit==='ประโยค'?'ประโยคในบทสนทนา':'คลังคำ'});item.tokenOrder.filter(idx=>!item.selected.includes(idx)).forEach(idx=>{const b=button(q.tokens[idx],()=>commit(n=>{activeItem(n).selected.push(idx);}),{'aria-label':'เพิ่ม'+(q.orderUnit||'คำ')+' '+q.tokens[idx],lang:'de'});b.disabled=!!item.attempt;words.append(b);});card.append(slots,words);}
if(!item.attempt){const actions=node('div',undefined,{class:'row actions'});const check=button(q.kind==='write'?'บันทึกคำตอบ':'ตรวจคำตอบ',submit,{class:'primary',id:'check'});check.disabled=!ready(item);actions.append(backButton(q),check);card.append(actions);}
if(item.attempt){const a=item.attempt,feedback=node('div',undefined,{class:'feedback'+(a.correct===false?' wrong':''),role:'status',id:'feedback'});if(q.kind==='write'){feedback.append(node('h2','บันทึกคำตอบแล้ว'),node('p',a.response,{lang:'de'}),node('p','คำตอบที่เขียนเองไม่มีเฉลยตายตัว ระบบจึงไม่ตัดสินว่าถูกหรือผิด'),node('p','เกณฑ์ที่คุณตรวจแล้ว: '+q.rubric.filter((_,index)=>item.rubricChecks.includes(index)).join(' · ')),...(q.explanation?[node('p',q.explanation)]:[]));}else{feedback.append(node('h2',a.correct?'ถูกต้อง':'ยังไม่ถูก'));const questionTranslation=BANK.historySkill==='phrases'?phraseQuestionTranslation(q):null;if(questionTranslation)feedback.append(node('p','คำแปลคำถาม: '+questionTranslation,{class:'thai-translation',lang:'th'}));feedback.append(node('p','คำตอบ: '+(q.feedbackAnswer||(q.sentence?q.sentence.replace('___',q.acceptedAnswers[0]):q.acceptedAnswers[0])),{lang:'de'}),node('p',BANK.thaiSupport?.translations[q.id]||'',{class:'thai-translation',lang:'th'}),...(q.explanation?[node('p',q.explanation)]:[]));}card.append(feedback);
card.append(button(s.position===s.items.length-1?'จบชุดฝึก':'ข้อต่อไป',()=>{if(commit(n=>{const session=current(n);activeItem(n).attempt.status='completed';if(session.position===session.items.length-1)session.completed=true;else{session.position++;}})){focusTitle();}},{class:'primary',id:'next'}));}
if(item.attempt){const navigation=node('div',undefined,{class:'row actions'});navigation.append(backButton(q));const next=card.querySelector('#next');if(next)navigation.append(next);card.append(navigation);}decorateVocabularyNouns(card,q);app.append(card);}
function submit(){const item=activeItem();if(!item||item.attempt||!ready(item))return;const result=grade(item);commit(n=>{const row=activeItem(n);row.attempt={...result,response:answerText(row),...(row.question.kind==='write'?{selfAssessed:true,selfAssessment:row.question.rubric.filter((_,index)=>row.rubricChecks.includes(index))}:{}),confidence:null,status:'completed',submittedAt:new Date().toISOString(),hintUsed:row.hintUsed,translationUsed:row.translationUsed===true};});}
function sectionBreak(){
 const s=current();const previous=s.items[s.position-1].question;
 const sectionKey=q=>q.stageId||q.topicId;const items=s.items.filter(i=>sectionKey(i.question)===sectionKey(previous));
 const next=s.items[s.position].question;
 const card=node('section',undefined,{class:'card'});
 card.append(node('h1',previous.stageId?'ครบขั้นนี้แล้ว':'ฝึกหัวข้อนี้ครบแล้ว',{id:'q-title',tabindex:'-1'}),node('h2',sessionSections(s).find(section=>section.topicId===sectionKey(previous))?.title||previous.topicName||BANK.title),node('p',`${items.filter(i=>i.attempt?.correct===true).length} ข้อถูก จาก ${items.filter(i=>typeof i.attempt?.correct==='boolean').length} ข้อที่ตรวจได้`),node('p','ต่อไป: '+(sessionSections(s).find(section=>section.topicId===sectionKey(next))?.title||next.topicName||'หัวข้อถัดไป')));
 const actions=node('div',undefined,{class:'row actions'});
 actions.append(backButton(previous),button('ฝึกหัวข้อถัดไป',()=>{if(commit(n=>{delete current(n).breakAt;}))focusTitle();},{class:'primary',id:'continue-topic'}));card.append(actions);app.append(card);
}
function outcome(items){const graded=items.filter(item=>typeof item.attempt?.correct==='boolean');const correct=graded.filter(item=>item.attempt.correct===true).length;const writing=items.filter(item=>item.question.kind==='write').length;return `${graded.length?`ถูก ${correct}/${graded.length} ข้อที่ตรวจได้`:'ไม่มีข้อที่ตรวจอัตโนมัติ'}${writing?` · งานเขียน ${writing} ชิ้น (ทบทวนเอง)`:''}`;}
 function summary(){const s=current();app.append(node('h1',s.workflow==='guided'?'ฝึกครบทุกหัวข้อแล้ว':'ฝึกหัวข้อนี้ครบแล้ว'));const actions=node('div',undefined,{class:'row'});const nextTopic=BANK.nextTopic||BANK.nextTopics?.[0];actions.append(button('ฝึกหัวข้อถัดไป',()=>navigateTo(nextTopic?.href||BANK.manualHref||'/practice'),{class:'primary',id:'next-topic'}));actions.append(button('ฝึกเพิ่ม',()=>{if(s.workflow==='guided'&&BANK.dailyHref)navigateTo(BANK.dailyHref);else start(BANK.questions,5);},{id:'again'}));actions.append(button('จบ',()=>navigateTo('/'),{id:'finish'}));app.append(actions);}
 window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.data?.type!=='grammar-preview-direct-start')return;
  if(BANK.requireLearned){
    if(!Array.isArray(event.data.learnedItemIds))return;
    const learned=new Set(event.data.learnedItemIds.filter(id=>typeof id==='string'));
    BANK.questions=BANK.questions.filter(q=>(q.requiredItemIds||[q.itemId]).every(id=>learned.has(id)));
    if(BANK.sequenceByTopic)BANK.questions=BANK.questions.filter(q=>q.interaction!=='match'||BANK.questions.filter(other=>other.matchGroupId===q.matchGroupId).length===2);
    if(BANK.nextTopics)BANK.nextTopic=BANK.nextTopics.find(topic=>topic.itemIds.some(id=>learned.has(id)));
    if(state.sessions.some(session=>!session.completed&&session.items.some(item=>(item.question.requiredItemIds||[item.question.itemId]).some(id=>!learned.has(id))))){app.replaceChildren(node('p','ยังยืนยันประวัติเรียนของรอบที่ค้างไม่ได้ กรุณากลับไปตรวจบทเรียนก่อน'));app.append(button(BANK.learnLabel||'ไปเรียนคำศัพท์',()=>navigateTo(BANK.learnHref),{class:'primary'}));return;}
    if(BANK.sections){BANK.sections=BANK.sections.filter(section=>BANK.questions.some(q=>(q.stageId||q.topicId)===section.topicId));BANK.defaultCount=BANK.sections.reduce((n,section)=>n+Math.min(section.count,BANK.questions.filter(q=>(q.stageId||q.topicId)===section.topicId).length),0);}
    if(!BANK.questions.length){app.replaceChildren(node('p',BANK.emptyMessage||'ยังไม่มีคำที่เรียนแล้วในหัวข้อนี้'));app.append(button(BANK.learnLabel||'ไปเรียนคำศัพท์',()=>navigateTo(BANK.learnHref),{class:'primary'}));return;}
  }
  const requested=typeof event.data.resumeId==='string'?state.sessions.find(s=>s.id===event.data.resumeId&&!s.completed&&!s.archived):undefined;
  const pending=requested||(current()&&!current().completed&&!current().archived?current():[...state.sessions].reverse().find(s=>!s.completed&&!s.archived));
  if(pending){if(commit(n=>{n.activeId=pending.id;},false)){screen='session';render();focusTitle();}return;}
  start(BANK.questions,BANK.defaultCount,'practice');
});
if(!BANK.requireLearned)render();
if(window.parent!==window){const reportHeight=()=>window.parent.postMessage({type:'grammar-preview-height',height:Math.ceil(document.querySelector('main').getBoundingClientRect().height)+80},'*');new ResizeObserver(reportHeight).observe(document.querySelector('main'));reportHeight();}
</script></body></html>
